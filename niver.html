<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #bb73e0, #ff8ddb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .audio-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            z-index: 100;
        }

        .audio-btn:hover {
            transform: scale(1.1);
        }

        .header-title {
            text-align: center;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
        }

        .header-title h1 {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .header-title h2 {
            font-size: 1.4rem;
            font-weight: 600;
            opacity: 0.9;
        }

        /* Container das Polaroids */
        .gallery {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .polaroid {
            background: #ffffff;
            padding: 12px 12px 25px 12px;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
            width: 150px;
            text-align: center;
        }

        .polaroid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 2px;
        }

        /* Cartão de Mensagem */
        .card {
            background: rgba(255, 255, 255, 0.95);
            max-width: 450px;
            width: 100%;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .card p {
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .highlight {
            font-weight: 700;
            color: #7b2cbf;
        }

        .icons-middle {
            font-size: 1.8rem;
            margin: 15px 0;
        }

        .surprise-btn {
            background: #7b2cbf;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .surprise-btn:hover {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        footer {
            margin-top: 25px;
            color: #ffffff;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* MEDIA QUERY PARA CELULARES */
        @media (max-width: 600px) {
            body {
                padding: 15px;
                padding-bottom: 100px;
            }

            .header-title h1 {
                font-size: 1.6rem;
            }

            .header-title h2 {
                font-size: 1.1rem;
            }

            .gallery {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .polaroid {
                width: 200px;
                /* Aumenta a foto levemente para telas menores */
            }

            .polaroid img {
                height: 200px;
            }

            .card {
                padding: 18px;
            }

            .card p {
                font-size: 0.95rem;
            }

            .surprise-btn {
                width: 90%;
                max-width: 320px;
                font-size: 0.9rem;
                padding: 12px 16px;
            }
        }
    </style>
    </style>
</head>

<body>

    <button onclick="tocar()" class="audio-btn" title="Tocar música">♫</button>

    <audio id="musica">
        <source src="áudio.mpeg" type="audio/mpeg">
    </audio>

    <div class="header-title">
        <h1>FELIZ ANIVERSÁRIO!</h1>
    </div>

    <div class="gallery">
        <div class="polaroid">
            <img src="img/1.jpeg" alt="Foto 1">
        </div>
        <div class="polaroid">
            <img src="img/2.jpeg" alt="Foto 2">
        </div>
        <div class="polaroid">
            <img src="img/3.jpeg" alt="Foto 3">
        </div>
    </div>

    <div class="card">
        <p>Feliz niver, Rayssão do Brás! </p>
        <p>Que Deus te abençoe muito, te dê muita saúde, felicidade e dinheiro também kkk! </p>
        <p>Aproveita bastante seu dia, curte muito e come bastante bolo! </p>
        <p class="highlight">TUDO PRA CIMA E NADA PRA BAIXOOOOOO!!! </p>
    </div>

    <div class="icons-middle"></div>

    <button onclick="soltarConfeti()" class="surprise-btn">clique aqui!!</button>


    <script>
        function tocar() {
            let audio = document.getElementById("musica");
            audio.play();
        }

        function soltarConfeti() {
            confetti({
                particleCount: 120,
                spread: 70,
                origin: {y: 0.6}
            });
        }
    </script>

</body>

</html>
